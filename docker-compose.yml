services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aderencia
      POSTGRES_PASSWORD: aderencia
      POSTGRES_DB: aderencia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aderencia -d aderencia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      pull: false
    environment:
      DATABASE_URL: postgresql+psycopg2://aderencia:aderencia@db:5432/aderencia
      CORS_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      AZURE_DEVOPS_URL: ${AZURE_DEVOPS_URL:-}
      AZURE_DEVOPS_ORGANIZATION: ${AZURE_DEVOPS_ORGANIZATION:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      AZURE_DEVOPS_FIELD_WORK_DATE: ${AZURE_DEVOPS_FIELD_WORK_DATE:-}
      AZURE_DEVOPS_FIELD_ACTIVITY: ${AZURE_DEVOPS_FIELD_ACTIVITY:-}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    ports:
      - "43124:43124"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      pull: false
    ports:
      - "43123:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
